<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Dark Rounded Canvas -->
    <rect width="64" height="64" rx="16" fill="#09090b"/>
    <!-- Subtle Ambient Gradient Border -->
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderG)" stroke-width="1.5" fill="none"/>
    
    <!-- Stopwatch Top Pin / Pusher -->
    <path d="M30 6h4v4h-4z" fill="url(#klkGrad)"/>
    <path d="M47.5 10.5l2.8-2.8 2.8 2.8-2.8 2.8z" fill="url(#klkGrad)"/>
    
    <!-- Stopwatch Outer Dial -->
    <circle cx="32" cy="35" r="21" stroke="url(#klkGrad)" stroke-width="2.2" opacity="0.9"/>
    
    <!-- Dial Ticks -->
    <path d="M32 14v3M32 53v3M11 35h3M50 35h3M17.1 20.1l2.1 2.1M44.8 47.8l2.1 2.1M17.1 49.9l2.1-2.1M44.8 22.2l2.1-2.1" stroke="url(#klkGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Stylized Geometric K Monogram -->
    <path d="M24 23v24" stroke="url(#klkGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 23L25 35l13 12" stroke="url(#klkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 29l-6 6 6 6" stroke="url(#klkGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <defs>
        <linearGradient id="klkGrad" x1="14" y1="6" x2="52" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="50%" stop-color="#2dd4bf"/>
            <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="borderG" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
        </linearGradient>
    </defs>
</svg>
